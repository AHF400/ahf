<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>AHF Prova</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AHF Prova">
<meta name="theme-color" content="#14644c">
<link rel="apple-touch-icon" href="../icona-180.png">
<link rel="icon" type="image/png" href="../icona-512.png">
<meta name="robots" content="noindex">
<style>
 html,body{margin:0;height:100%;background:#f4f1ea;overflow:hidden}
 body{font-family:-apple-system,system-ui,sans-serif;color:#14644c}
 #m{position:absolute;inset:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;text-align:center}
 #m>div{max-width:420px}
 p{font-size:16px;line-height:1.45;color:#2f5d4f}
 .p{background:#fff;border-radius:16px;padding:14px 16px;text-align:left}
 /* striscia dell'ora verde come la testata: l'effetto sfocato di iOS su un colore uniforme non si nota */
 html.app,html.app body{background:#145c4a}
 html.app body{background:linear-gradient(90deg,#145c4a,#1f7a63)}
 html.app #m{color:#fff}
 html.app #m p{color:#fff}
 /* 36 px in più: l'effetto di iOS 26 scende sotto l'ora, misurato su iPhone il 06/11 */
 iframe{--alto:calc(env(safe-area-inset-top) + 36px);position:absolute;left:0;right:0;top:var(--alto);bottom:0;width:100%;height:calc(100% - var(--alto));border:0;background:#f2f7f5}
</style>
</head>
<body>
<div id="m"></div>
<script>
// PROVA della vista da app: l'inventario resta in un riquadro di questa pagina, quindi iPhone non vede cambi di sito.
// Senza manifest: un «start_url» farebbe perdere la chiave che sta dopo il # (e che non viene mai inviata a questo sito).
var EXEC = "https://script.google.com/macros/s/AKfycbwwbmUmLlI1DKvw42KLxt2nnHn8AowJxWOnNRG1vMEUgWmrqX62OvrhhRosBlt3-aI2AQ/exec";
var q = new URLSearchParams(location.hash.slice(1)), t = (q.get('t') || '').replace(/[^\w-]/g, '');
var m = document.getElementById('m');
var daIcona = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
if (t && (q.get('go') === '1' || daIcona)) {
  document.documentElement.className = 'app';
  m.innerHTML = '<div><p>Apro l\'inventario…</p></div>';
  var f = document.createElement('iframe');
  f.src = EXEC + '?f=1&t=' + t;
  f.allow = 'camera *; microphone *; clipboard-write *';
  document.body.appendChild(f);
} else if (t) {
  history.replaceState(null, '', '#t=' + t + '&go=1');   // l'icona salvata aprirà direttamente il riquadro
  m.innerHTML = '<div><h2>AHF Prova</h2><div class="p"><p>1. Tocca <b>Condividi</b>, il quadrato con la freccia (se non lo vedi, tocca prima i tre puntini).<br>2. Scegli <b>Aggiungi alla schermata Home</b>.<br>3. Controlla che <b>Apri come app web</b> sia acceso, poi tocca <b>Aggiungi</b>.</p><p>Poi apri la prova da quell\'icona.</p></div></div>';
} else {
  m.innerHTML = '<div><p>Per la prova apri l\'inventario e vai su <b>Profilo → Prova vista app</b>.</p></div>';
}
</script>
</body>
</html>
