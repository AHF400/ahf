<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>AHF App</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AHF App">
<meta name="theme-color" content="#1f4e8c">
<link rel="apple-touch-icon" href="icona-180.png">
<link rel="icon" type="image/png" href="icona-512.png">
<meta name="robots" content="noindex">
<style>
 :root{--sf:#eef1f6;--card:#fff;--tx:#1f4e8c;--tx2:#4d5f78;--om:rgba(0,0,0,.08)}
 @media (prefers-color-scheme:dark){:root{--sf:#131a26;--card:#1d2636;--tx:#a9c8f0;--tx2:#a9b5c6;--om:rgba(0,0,0,.35)}}
 *{box-sizing:border-box}
 body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--sf);color:var(--tx);padding:calc(env(safe-area-inset-top) + 50px) 16px 40px}
 main{max-width:520px;margin:0 auto}
 h1{font-size:26px;margin:0 0 18px;text-align:center}
 a.app{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;padding:12px 14px;margin:0 0 12px;text-decoration:none;color:inherit;box-shadow:0 2px 10px var(--om)}
 a.app img{width:60px;height:60px;border-radius:14px;flex:none}
 a.app b{display:block;font-size:18px}
 a.app span{display:block;font-size:14px;line-height:1.35;color:var(--tx2);margin-top:2px}
 details{margin-top:22px;font-size:14px;line-height:1.5;color:var(--tx2)}
 summary{cursor:pointer;font-weight:600}
 /* Vista da app: le app si aprono in un riquadro di questa pagina, così iPhone non vede cambi di sito e non mostra il browser interno.
    iOS 26 sfuma la zona dell'ora e circa 35 punti sotto: lì sta solo la banda, con il tasto per tornare all'elenco. */
 #banda{position:fixed;top:0;left:0;right:0;z-index:2;height:calc(env(safe-area-inset-top) + 28px);background:#1f4e8c;display:flex;align-items:flex-end}
 #torna{display:none;height:100%;padding:0 18px 4px 12px;border:0;background:none;color:#fff;font:600 14px -apple-system,system-ui,sans-serif;align-items:flex-end}
 html.dentro,html.dentro body{overflow:hidden;height:100%}
 html.dentro #torna{display:flex}
 html.dentro main{display:none}
 #quadro{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 28px);bottom:0}
 #quadro iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<div id="banda"><button id="torna" type="button">‹ AHF App</button></div>
<main>
 <h1>AHF App</h1>
 <div id="elenco"></div>
 <details><summary>Metti questa pagina sul telefono</summary><p id="passi"></p></details>
</main>
<script>
// PER AGGIUNGERE UN'APP: una riga qui sotto. L'immagine sta nel repository, accanto alla pagina di passaggio dell'app.
// id = nome nell'indirizzo; banda e sfondo = colori della testata e della pagina dell'app. L'app deve accettare ?f=1 (riquadro).
var APP = [
 { id: 'inventario', banda: 'linear-gradient(90deg,#145c4a,#1f7a63 85%,#27876e)', sfondo: '#f2f7f5', nome: 'AHF Inventario', cosa: 'Prodotti, conte e lista della spesa', icona: '../icona-180.png', url: 'https://script.google.com/macros/s/AKfycbwwbmUmLlI1DKvw42KLxt2nnHn8AowJxWOnNRG1vMEUgWmrqX62OvrhhRosBlt3-aI2AQ/exec' },
 { id: 'ristoro', banda: 'linear-gradient(90deg,#e4572e,#f08a24 75%,#f29a2c)', sfondo: '#fff8ef', nome: 'AHF Ristoro', cosa: 'Menù della settimana e cucina', icona: '../ristoro/icona-180.png', url: 'https://script.google.com/macros/s/AKfycbw1zjndmbMlCBGNSxd9xpqWls3g2b-7s4CombMRhmkHgWTnaMgFcjg7Fi745VEUNUTQuw/exec' }
];
var el = document.getElementById('elenco');
APP.forEach(function (a) {
  var l = document.createElement('a'); l.className = 'app'; l.href = '#' + a.id;
  var i = document.createElement('img'); i.src = a.icona; i.alt = '';
  var d = document.createElement('div'), b = document.createElement('b'), s = document.createElement('span');
  b.textContent = a.nome; s.textContent = a.cosa;
  d.appendChild(b); d.appendChild(s); l.appendChild(i); l.appendChild(d); el.appendChild(l);
});
// L'indirizzo dice cosa mostrare (#ristoro = l'app, vuoto = l'elenco): così funziona anche il tasto Indietro di Android.
function mostra() {
  var a = APP.filter(function (x) { return '#' + x.id === location.hash; })[0];
  var q = document.getElementById('quadro'), b = document.getElementById('banda');
  if (q) q.remove();
  document.documentElement.className = a ? 'dentro' : '';
  b.style.background = a ? a.banda : '';
  document.documentElement.style.background = document.body.style.background = a ? a.sfondo : '';
  if (!a) return;
  var f = document.createElement('iframe');
  f.src = a.url + '?f=1';
  f.allow = 'camera *; microphone *; clipboard-write *';
  q = document.createElement('div'); q.id = 'quadro'; q.appendChild(f);
  document.body.appendChild(q);
}
window.addEventListener('hashchange', mostra);
document.getElementById('torna').onclick = function () { location.hash = ''; };
mostra();
document.getElementById('passi').innerHTML = /Android/i.test(navigator.userAgent)
  ? '1. Tocca i <b>tre puntini ⋮</b> in alto a destra.<br>2. Scegli <b>Aggiungi a schermata Home</b>.<br>3. Conferma con <b>Aggiungi</b> o <b>Installa</b> (se te lo chiede, scegli <b>Crea collegamento</b>).'
  : '1. Tocca <b>Condividi</b>, il quadrato con la freccia (se non lo vedi, tocca prima i tre puntini).<br>2. Scegli <b>Aggiungi alla schermata Home</b>.<br>3. Tocca <b>Aggiungi</b>.';
</script>
</body>
</html>
